<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Samuel Pádua</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Define o tema antes da primeira pintura, para não piscar.
    (function () {
      var prefereClaro = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.setAttribute("data-theme", prefereClaro ? "light" : "dark");
    })();
  </script>
  <style>
    .holding {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 0;
      text-align: center;
    }

    .holding .logo {
      width: 168px;
      height: auto;
      margin: 0 auto 40px;
    }

    .holding h1 {
      font-family: "Archivo", sans-serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .holding p {
      max-width: 42ch;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
    }

    .holding .rule {
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <div class="topline"></div>

  <main>
    <section class="holding">
      <div class="shell">
        <img class="logo logo--dark" src="logo2.svg" alt="Logotipo Samuel Pádua">
        <img class="logo logo--light" src="logo.svg" alt="Logotipo Samuel Pádua">
        <p class="eyebrow">Samuel Pádua</p>
        <h1>Nada por aqui<br><span class="accent">no momento.</span></h1>
        <span class="rule"></span>
        <p>
          Esta página não está disponível. Se você chegou aqui por um link que recebeu,
          é só me chamar que eu reenvio o endereço correto.
        </p>

        <div class="closing-contact">
          <a href="mailto:osamuelpadua@gmail.com">osamuelpadua@gmail.com</a>
          <a href="https://www.samuelpadua.com.br" target="_blank" rel="noopener">www.samuelpadua.com.br</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
